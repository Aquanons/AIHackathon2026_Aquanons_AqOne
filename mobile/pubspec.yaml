name: aqone
description: AqOne fisherman app - offline SOS handoff to LoRa buoys.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Localization (en / fil / akl). See docs/22_LOCALIZATION_PLAN.md.
  # Locale code is `fil`, not `tl`: flutter_localizations ships
  # GlobalMaterialLocalizations for fil only, and an unsupported locale in
  # supportedLocales throws "No MaterialLocalizations found" at runtime.
  flutter_localizations:
    sdk: flutter
  # Pinned, not `any`. gen-l10n's generated code imports intl, so an
  # unconstrained resolve can swap it under the localisations and break the
  # build for one person and nobody else. flutter_localizations already
  # narrows this hard - 0.20.2 is what it resolves to today.
  intl: ^0.20.2

  http: ^1.2.2
  sqflite: ^2.3.3
  # Web-only sqflite backend. Pinned for the same reason as intl: `any` makes
  # the build depend on when you last resolved.
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0

  # Bumped from ^13.0.1 to match the version the Venture code is proven
  # against. LocationService already uses the modern locationSettings API,
  # so no call-site changes were needed.
  geolocator: ^14.0.3

  # Venture map. Versions pinned to what the source project resolved.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Tappable emergency contact numbers.
  url_launcher: ^6.3.2

  # WiFi Chathub (Heltec WiFi relay). Versions pinned to what the source
  # project resolved.
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  network_info_plus: ^8.2.1

  # Profile picture upload (camera / gallery).
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Venture compass. sensors_plus rather than flutter_compass: the latter is
  # unmaintained and declares no Android namespace, so it will not build under
  # AGP 8. Heading is derived from the magnetometer + accelerometer in
  # services/compass_service.dart.
  #
  # 7.1.0 or newer is required, not merely preferred: 6.x applies the Kotlin
  # Gradle Plugin itself, which Flutter now warns about and will later refuse
  # to build. 7.1.0 added Built-in Kotlin support. Its 7.0.0 floor (AGP
  # 8.12.1+, Gradle 8.13+, Kotlin 2.2.0) is already met by this project -
  # android/settings.gradle.kts pins AGP 9.0.1 and Kotlin 2.3.20 on Gradle
  # 9.1.0.
  sensors_plus: ^7.1.0

  # SOS alarm: looping vibration + alarm tone when a distress call is raised.
  vibration: ^3.1.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Runs gen-l10n on `flutter pub get`, driven by l10n.yaml.
  generate: true

  assets:
    - assets/images/aqone_logo.png
    - assets/images/aqoneLogo1.png
    - assets/images/aqoneLogo2.png
    - assets/audio/sos_alarm.wav
    # Team photo on the in-app welcome notice (see WelcomeAdvisory).
    - assets/images/team_aquanons.jpg

name: aqone
description: AqOne fisherman app - offline SOS handoff to LoRa buoys.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Brand assets are optional. Every Image.asset in the app has an
  # errorBuilder fallback, so the app runs without them. To enable the real
  # artwork, copy background.png, aqoneLogo2.png and aqoneLogo3.png into
  # mobile/assets/ and uncomment the block below. Declaring an asset that
  # does not exist fails the build, so keep these commented until the files
  # are present.
  #
  # assets:
  #   - assets/images/background.png
  #   - assets/icons/aqoneLogo2.png
  #   - assets/icons/aqoneLogo3.png

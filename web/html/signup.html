<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AqOne — No Public Registration</title>
    <link rel="stylesheet" href="../css/style.css" />
    <meta http-equiv="refresh" content="4; url=login.html" />
  </head>
  <body>
    <!--
      Public registration was removed. The AqOne dashboard is an MDRRMO/LGU
      operations tool, so accounts are created by an administrator through
      html/admin-signup.html, which requires a server-side setup key and is not
      linked from anywhere in the app.

      This file remains only so existing links and bookmarks land somewhere
      sensible instead of 404ing. Safe to delete once no stale links remain.
    -->
    <div class="page-shell">
      <main class="page-content">
        <div class="content-card">
          <div class="footer-row">
            <a class="login-link" href="../index.html" aria-label="Back">&larr;</a>
          </div>

          <h2>No public sign-up</h2>

          <p>
            AqOne dashboard accounts are created by an administrator. If you
            need access, contact your MDRRMO or LGU administrator.
          </p>
          <p>Redirecting you to the log in page&hellip;</p>

          <div class="button-row">
            <a class="button-next" href="login.html">Go to Log In</a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

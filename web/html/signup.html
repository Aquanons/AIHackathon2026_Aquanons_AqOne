<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AqOne - Sign Up</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <video class="bg-video" autoplay muted loop playsinline poster="../assets/pic/bg.png">
      <source src="../assets/vid/bgvid.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="page-shell">
      <main class="page-content">
        <div class="content-card">
          <div class="footer-row">
            <a class="login-link" href="../index.html" aria-label="Back">←</a>
          </div>

          <h2>Sign Up</h2>

          <form class="form-fields" id="signupForm" onsubmit="return false;">
            <input
              type="text"
              id="fullName"
              placeholder="Full name"
              autocomplete="name"
              required
            />
            <input
              type="email"
              id="email"
              placeholder="Official email (.gov.ph)"
              autocomplete="email"
              required
            />
            <input
              type="text"
              id="position"
              placeholder="Position / Designation"
              required
            />
            <input
              type="text"
              id="office"
              placeholder="Office / LGU assigned"
              required
            />
            <select id="role" required>
              <option value="" disabled selected>Select role</option>
              <option value="bfar">BFAR Officer</option>
              <option value="lgu">LGU Admin</option>
              <option value="barangay">Barangay Official</option>
            </select>
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="new-password"
              required
            />
            <label class="checkbox-row">
              <input type="checkbox" id="consent" required />
              <span>
                I agree to the
                <a class="footer-link" href="terms.html">Data Privacy Policy</a>
                and consent to the collection and use of my personal data.
              </span>
            </label>
          </form>

          <div class="button-row">
            <button class="button-clear" type="reset" form="signupForm">Clear</button>
            <button class="button-next" type="submit" form="signupForm">Sign Up</button>
          </div>

        </div>
      </main>
    </div>

    <script src="../js/script.js"></script>
  </body>
</html>

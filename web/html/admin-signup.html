<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AqOne Admin Setup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07131f;
      color: #eef7ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      background: rgba(13, 31, 49, 0.92);
      box-shadow: 0 24px 80px rgba(0,0,0,0.38);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 22px; color: rgba(238,247,255,0.72); line-height: 1.45; }
    label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 700; }
    input, select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 15px;
    }
    select option { color: #07131f; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: #14b8a6;
      color: #03201d;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
    }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    .hint { font-size: 12px; color: rgba(238,247,255,0.5); margin: 6px 0 0; }
    .message { min-height: 20px; margin-top: 16px; font-size: 14px; }
    .message.error { color: #fca5a5; }
    .message.success { color: #86efac; }
  </style>
</head>
<body>
  <main>
    <h1>Admin Setup</h1>
    <p>Create a dashboard operator account. Requires the server-side setup key.</p>

    <form id="setupKeyForm" autocomplete="off">
      <label for="setupKey">Setup Key</label>
      <input id="setupKey" name="setup_key" type="password" required />
      <button type="submit" id="verifyBtn">Continue</button>
    </form>

    <form id="adminSignupForm" autocomplete="off" hidden>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <p class="hint">This is the address used to log in.</p>

      <label for="fullName">Full name</label>
      <input id="fullName" name="full_name" type="text" autocomplete="name" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <p class="hint">Minimum 8 characters.</p>

      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="mdrrmo">MDRRMO</option>
        <option value="lgu">LGU</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </main>
  <script src="../js/admin-signup.js"></script>
</body>
</html>

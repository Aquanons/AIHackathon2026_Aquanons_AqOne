<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AqOne - Log In</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <video class="bg-video" autoplay muted loop playsinline poster="../assets/pic/bg.png">
      <source src="../assets/vid/bgvid.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="page-shell">
      <main class="page-content">
        <div class="content-card">
          <div class="footer-row">
            <a class="login-link" href="../index.html" aria-label="Back">←</a>
          </div>

          <h2>Log In</h2>

          
          <form class="form-fields" id="loginForm" onsubmit="return false;">
            <input
              type="email"
              id="email"
              placeholder="Email address"
              autocomplete="email"
              required
            />
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
          </form>

          <div class="button-row">
            <button class="button-clear" type="reset" form="loginForm">Clear</button>
            <button class="button-next" type="submit" form="loginForm">Log In</button>
          </div>

          

          <footer class="page-footer">
            <p>By logging in, you agree to our</p>
            <a class="footer-link" href="terms.html">Privacy Policy</a>
            <p>and</p>
            <a class="footer-link" href="terms.html">Terms & Conditions.</a>
          </footer>
        </div>
      </main>
    </div>

    <script src="../js/script.js"></script>
  </body>
</html>

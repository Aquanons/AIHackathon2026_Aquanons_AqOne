<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AqOne</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <img src="../../admin/assets/icons/logo.png" alt="AqOne" class="auth-logo">
    <h1>Sign in</h1>
    <p class="auth-sub">Maritime Intelligence for Aklan LGU</p>

    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g. admin" autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />

      <label class="remember">
        <input type="checkbox" id="remember" /> Remember me
      </label>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>
      <p class="auth-error" id="auth-error"></p>
    </form>

    <p class="auth-hint">Demo account: username <b>admin</b>, any password.</p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>

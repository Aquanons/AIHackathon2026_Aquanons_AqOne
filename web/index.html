<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AqOne — v2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="../../admin/assets/icons/logo.png" alt="AqOne logo" class="logo">
      <span class="brand-name">AqOne</span>
    </div>
    <nav class="nav-links">
      <a href="login.html" class="btn btn-ghost">Sign In</a>
    </nav>
  </header>

  <section class="hero">
    <h1>AqOne Maritime Dashboard</h1>
    <p>Version 2 — login, vessel tracking and alert lists now work (on sample data).</p>
    <a href="login.html" class="btn btn-primary btn-big">Get Started</a>
  </section>

  <section class="features">
    <div class="feature-card">
      <h3>Vessel Tracking</h3>
      <p>Markers + live list.</p>
    </div>
    <div class="feature-card">
      <h3>Alert Feed</h3>
      <p>Recent incidents.</p>
    </div>
    <div class="feature-card">
      <h3>Advisories</h3>
      <p>Working list.</p>
    </div>
  </section>

  <footer class="footer">AqOne v0.2 — beta prototype</footer>

</body>
</html>

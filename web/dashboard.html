<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AqOne</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="../../admin/assets/icons/logo.png" alt="AqOne logo" class="logo">
      <span class="brand-name">AqOne</span>
    </div>

    <div class="header-search">
      <input type="text" id="search" placeholder="Search vessels..." />
    </div>

    <div class="live-badge">LIVE</div>
    <div class="user-chip" id="user-chip">Guest</div>
  </header>

  <div class="app-body">

    <!-- MAP -->
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-coords" id="coords">11.6500° N, 122.4300° E</div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="panel">
        <div class="panel-head">
          <h3>Quick Stats</h3>
          <span class="last-updated" id="last-updated">Last updated: 0s ago</span>
        </div>
        <div class="sample-note">Displaying sample data</div>
        <div class="stat-row">
          <span>Registered Vessels</span>
          <strong id="vessel-count">0</strong>
        </div>
        <div class="stat-row">
          <span>Active Alerts</span>
          <strong id="alert-count">0</strong>
        </div>
        <div class="stat-row">
          <span>Online Buoys</span>
          <strong id="buoy-count">0</strong>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Vessels</h3>
          <select id="status-filter" class="select-sm">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="overdue">Overdue</option>
          </select>
        </div>
        <ul id="vessel-list" class="vessel-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Alerts</h3>
          <span class="count-badge" id="alert-badge">0</span>
        </div>
        <div id="alert-list" class="alert-list"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Advisories</h3>
        </div>
        <div id="advisory-list" class="advisory-list"></div>
      </div>

      <div class="panel">
        <h3>Forecast</h3>
        <p class="stub">Coming soon.</p>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

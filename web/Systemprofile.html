<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AqOne - My Profile</title>
    <link rel="stylesheet" href="sys.css" />
</head>

<body class="profile-body">

    <header class="app-header">
        <div class="header-brand">
            <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </a>
            <img class="top-logo" src="/assets/icons/aqoneLogo2.png" alt="AqOne" />
            <span class="top-title">AqOne</span>
        </div>

        <div class="header-user-dropdown" id="header-user-dropdown">
            <div class="header-user-avatar">LG</div>
            <span class="header-user-name">LGU Administrator</span>
        </div>
    </header>

    <main class="profile-shell">

        <!-- ─── LEFT COLUMN: PROFILE CARD ─── -->
        <aside class="profile-side">
            <div class="profile-card">
                <div class="profile-card-avatar-wrap">
                    <div class="profile-card-avatar">LG</div>
                </div>
                <div class="profile-card-name">LGU Administrator</div>
                <div class="profile-card-role">Municipal Disaster Risk Reduction Officer</div>
                <div class="profile-card-office">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    Kalibo, Aklan
                </div>
            </div>

            <button class="profile-logout-btn" id="btn-logout">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Log Out
            </button>
        </aside>

        <!-- ─── RIGHT COLUMN: SINGLE STREAMLINED FORM ─── -->
        <section class="profile-main">
            <div class="profile-panel">
                <div class="profile-panel-header">
                    <h3>Edit Profile</h3>
                    <p>Update your personal info and security credentials.</p>
                </div>

                <div class="profile-form-grid">
                    <div class="profile-field">
                        <label for="pf-fullname">Full Name</label>
                        <input type="text" id="pf-fullname" value="LGU Administrator" />
                    </div>
                    <div class="profile-field">
                        <label for="pf-email">Email Address</label>
                        <input type="email" id="pf-email" value="admin@kalibo.aklan.gov.ph" />
                    </div>
                    <div class="profile-field">
                        <label for="pf-position">Position</label>
                        <input type="text" id="pf-position" value="Municipal Disaster Risk Reduction Officer" />
                    </div>
                    <div class="profile-field">
                        <label for="sec-new-password">New Password</label>
                        <input type="password" id="sec-new-password" placeholder="Leave blank to keep current" />
                    </div>
                </div>

                <div class="profile-panel-actions">
                    <button class="profile-btn profile-btn-primary" id="btn-save-personal">Save Changes</button>
                </div>
            </div>
        </section>

    </main>

</body>

</html>

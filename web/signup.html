<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account â€” AqOne Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card" id="auth-card">
    <img src="../../admin/assets/icons/aqoneLogo2.png" alt="AqOne" class="auth-logo">
    <h1>Create account</h1>
    <p class="auth-sub">Register to access the AqOne maritime console</p>

    <form id="signup-form" novalidate>
      <label for="s-username">Username</label>
      <input type="text" id="s-username" placeholder="letters, numbers, no spaces" autocomplete="username" required />
      <p class="field-hint" id="s-username-hint"></p>

      <label for="s-name">Display name</label>
      <input type="text" id="s-name" placeholder="e.g. LGU Administrator" autocomplete="name" required />

      <label for="s-role">Role</label>
      <select id="s-role">
        <option value="Operator">Operator</option>
        <option value="Administrator">Administrator</option>
        <option value="Viewer">Viewer</option>
      </select>

      <label for="s-password">Password <span class="muted">(min 6 characters)</span></label>
      <input type="password" id="s-password" placeholder="Choose a password" autocomplete="new-password" required />

      <label for="s-confirm">Confirm password</label>
      <input type="password" id="s-confirm" placeholder="Repeat your password" autocomplete="new-password" required />

      <label class="remember">
        <input type="checkbox" id="s-terms" required />
        <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Use</a>.</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
      <p class="auth-error" id="auth-error" role="alert"></p>
    </form>

    <p class="auth-hint">Already registered? <a href="login.html">Sign in</a></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
